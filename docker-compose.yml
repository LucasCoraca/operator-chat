version: '3.8'

services:
  # MariaDB Database
  mariadb:
    image: mariadb:11
    container_name: chatinterface-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
      MYSQL_DATABASE: ${DB_NAME:-chatinterface}
      MYSQL_USER: ${DB_USER:-chatapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chatapp_secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - chatinterface-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatinterface-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3584}
      PORT: 3001
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:-chatapp_secret}
      DB_NAME: ${DB_NAME:-chatinterface}
      JWT_SECRET: ${JWT_SECRET:-operator-chat-secret-key-12345}
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://localhost:8080}
      LLAMA_MODEL: ${LLAMA_MODEL:-claude-3-5-sonnet-20241022}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      # KoboldCpp serves both TTS (/api/extra/tts) and Whisper STT (/api/extra/transcribe).
      # TTS_BASE_URL / WHISPER_BASE_URL override each independently if needed.
      KCPP_BASE_URL: ${KCPP_BASE_URL:-http://192.168.15.126:5001}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-kobo}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080}
      SEARXNG_SAFE_SEARCH: ${SEARXNG_SAFE_SEARCH:-1}
      DEBUG_LLAMA: ${DEBUG_LLAMA:-0}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backend_data:/app/data
      - backend_sandboxes:/app/sandboxes
    networks:
      - chatinterface-network
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatinterface-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    environment:
      # Optional: set to your LAN IP/hostname (e.g. 192.168.15.50) to add it to
      # the self-signed cert's SAN. The mic works once you accept the warning.
      CERT_HOST: ${CERT_HOST:-}
    volumes:
      # Persist the generated self-signed cert across rebuilds/restarts
      - frontend_certs:/etc/nginx/certs
    networks:
      - chatinterface-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Optional: phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: chatinterface-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - chatinterface-network
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    profiles:
      - dev

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: always
    ports:
      - "8880:8880"
      
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: llama-swap
    restart: always
    runtime: nvidia
    ports:
      - "9292:8080"
    volumes:
      - ./models:/models
      - ./llama_swap/config.yaml:/app/config.yaml:ro
    networks:
      - chatinterface-network
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - BASE_URL=http://localhost:8888/
    networks:
      - chatinterface-network

  mcp-searxng:
    image: isokoliuk/mcp-searxng:latest
    container_name: mcp-searxng
    restart: unless-stopped
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HTTP_PORT: 3333
      NODE_ENV: production
    ports:
      - "3333:3333"
    networks:
      - chatinterface-network
    depends_on:
      - searxng
      
  fetch-mcp:
    image: supercorp/supergateway:uvx
    container_name: fetch-mcp
    restart: unless-stopped
    command:
      [
        "--stdio", "uvx mcp-server-fetch",
        "--outputTransport", "sse",
        "--port", "8811",
        "--ssePath", "/sse",
        "--messagePath", "/message",
        "--logLevel", "info"
      ]
    ports:
      - "8811:8811"
    networks:
      - chatinterface-network
      
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: playwright-mcp
    restart: unless-stopped
    init: true
    entrypoint: ["node"]
    command:
      [
        "/app/cli.js",
        "--headless",
        "--browser", "chromium",
        "--no-sandbox",
        "--port", "8931",
        "--host", "0.0.0.0",
        "--allowed-hosts", "localhost:8931,127.0.0.1:8931,playwright-mcp:8931,192.168.15.45:8931"
      ]
    ports:
      - "8931:8931"
    networks:
      - chatinterface-network
    shm_size: "2gb"

  whisper-cpp:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: whisper-cpp
    restart: unless-stopped
    entrypoint: ["whisper-server"]
    command:
      [
        "--host", "0.0.0.0",
        "--port", "8080",
        "--model", "/models/ggml-large-v3-turbo.bin",
        "--inference-path", "/v1/audio/transcriptions",
        "--threads", "32",
        "--processors", "1",
        "--convert",
        "--print-progress",
        "--no-gpu"
      ]
    ports:
      - "2022:8080"
    volumes:
      - ./models:/models
    networks:
      - chatinterface-network
    cpus: "32.0"


volumes:
  mariadb_data:
    driver: local
  backend_data:
    driver: local
  backend_sandboxes:
    driver: local
  frontend_certs:
    driver: local

networks:
  chatinterface-network:
    driver: bridge
  searxng-net:
    driver: bridge
