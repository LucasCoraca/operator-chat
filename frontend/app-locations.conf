# Shared app config, included by both the HTTP (80) and HTTPS (443) server
# blocks in nginx.conf.

root /usr/share/nginx/html;
index index.html;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;

# API proxy to backend. The `^~` prefix ensures this block wins over the
# static-asset regex below; otherwise *.png/*.svg under /api/ (e.g. agent
# browser screenshots at /api/agent-attachments/*.png) would be matched
# by the regex location and 404 against the SPA root instead of being
# proxied to the backend.
location ^~ /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
    # Allow large screenshot uploads/downloads.
    client_max_body_size 32m;
}

# Cache static assets (anything that survives the ^~ /api/ block above is
# served from the SPA bundle).
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# WebSocket support
location /socket.io/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA fallback - serve index.html for all routes. index.html must NOT be
# cached: it references hash-named bundles, so a stale cached copy would
# load an old (possibly removed) bundle and hang the app. The hashed assets
# themselves stay immutable (cached above); only this entry point revalidates.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
}

# Health check endpoint
location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
}
