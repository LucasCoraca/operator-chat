# HTTP server. Works for localhost (a secure context, so the mic works there
# without TLS). Kept available alongside HTTPS.
server {
    listen 80;
    server_name _;
    include /etc/nginx/app-locations.conf;
}

# HTTPS server. Needed so the app is a secure context when accessed over a LAN
# IP (e.g. https://192.168.x.x) — browsers only expose getUserMedia (microphone)
# on secure origins. Uses a self-signed cert generated at container startup
# (see /docker-entrypoint.d/40-generate-cert.sh); accept the browser warning.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/app-locations.conf;
}
